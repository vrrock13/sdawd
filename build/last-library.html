<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지식의 방주: 라스트 라이브러리</title>
    <style>
:root {
  --bg: #17121c;
  --panel: #2d2130;
  --ink: #f2e8d9;
  --dim: #baa8b3;
  --accent: #d8ad77;
  --warn: #d35d63;
  --teal: #70b8b3;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 15% 0%, #58304f, transparent 55%),
    radial-gradient(1000px 700px at 85% 10%, #2c3f63, transparent 60%),
    linear-gradient(180deg, #271a2d, #17121d 55%, #0f0d13);
  overflow-x: hidden;
}

.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: .18;
  background-image:
    radial-gradient(rgba(255,255,255,.18) .5px, transparent .8px),
    radial-gradient(rgba(255,255,255,.08) .5px, transparent .8px);
  background-size: 3px 3px, 4px 4px;
  background-position: 0 0, 1px 1px;
}

#fxCanvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .5; }
#screenFlash { position: fixed; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(circle, rgba(255,212,132,.36), transparent); opacity: 0; transition: .25s; }
#screenFlash.active { opacity: 1; }
#notification {
  position: fixed; right: 18px; bottom: 18px; z-index: 11;
  background: rgba(25, 16, 18, .94); border: 1px solid #9a7a5a; padding: 10px 12px; border-radius: 9px;
  transform: translateY(20px); opacity: 0; transition: .25s;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
#notification.show { transform: translateY(0); opacity: 1; }

.game-shell {
  position: relative;
  z-index: 2;
  max-width: 1480px;
  margin: 0 auto;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 14px;
  padding: 14px;
}

.frame {
  border: 1px solid #5f4755;
  box-shadow: 0 0 0 2px rgba(0,0,0,.48) inset, 0 18px 30px rgba(0,0,0,.3);
}

.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  background: linear-gradient(180deg, rgba(56,37,65,.92), rgba(31,22,36,.9));
  padding: 8px;
  border-radius: 10px;
}
.hud > div {
  position: relative;
  background: linear-gradient(180deg, #3e2a38, #2a1d2b);
  border: 1px solid #795c6f;
  border-radius: 8px;
  padding: 12px 10px;
  text-align: center;
  letter-spacing: .3px;
  font-weight: 600;
  text-shadow: 0 1px 0 rgba(0,0,0,.4);
  transition: transform .12s ease;
}
.hud > div::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--meter, 0%);
  background: linear-gradient(90deg, rgba(255,255,255,.1), rgba(216,173,119,.22));
  border-radius: 8px;
  pointer-events: none;
}

.main-grid {
  display: grid;
  grid-template-columns: 300px 1fr 300px;
  gap: 12px;
}

.panel {
  background: linear-gradient(180deg, rgba(63,35,56,.9), rgba(31,21,38,.94));
  padding: 12px;
  min-height: 320px;
  border-radius: 10px;
}
.panel h2 { margin: 0 0 8px; font-size: 18px; }
.panel h3 { margin: 12px 0 8px; color: #d9c7b2; font-size: 14px; font-weight: 600; }

.widget {
  border: 1px solid #a38b76;
  background: linear-gradient(180deg, #dbc8a7, #cfbb96);
  color: #2b2117;
  margin-bottom: 10px;
  border-radius: 6px;
}
.memo-panel { padding: 8px; display: grid; gap: 4px; }
.memo-panel label { font-size: 12px; display: flex; gap: 6px; align-items: center; }
.memo-panel input { accent-color: #7e5b68; }

.big-alert {
  width: 54px; height: 54px; border-radius: 50%; border: 2px solid #3b1e26;
  background: radial-gradient(circle at 30% 30%, #ffb2b5, #b53d43 60%, #7d2229);
  box-shadow: 0 0 0 4px #1d1218 inset, 0 0 20px rgba(230,83,89,.45);
}

.center-panel { display: grid; grid-template-rows: 1fr auto; gap: 10px; }
.monitor-shell {
  position: relative;
  background: linear-gradient(180deg, #676976, #3e3c4a);
  border: 2px solid #1d1925;
  border-radius: 8px;
  padding: 18px;
  min-height: 350px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), 0 8px 18px rgba(0,0,0,.28);
}
.screen-inner {
  height: 100%;
  border: 2px solid #2d2c37;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.1), transparent 40%),
    radial-gradient(circle at 50% 20%, #7990a0, #654b64 70%);
  box-shadow: inset 0 0 50px rgba(0,0,0,.42);
  position: relative;
  overflow: hidden;
  border-radius: 4px;
}
.scanline {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.03) 0, rgba(255,255,255,.03) 2px, transparent 2px, transparent 4px);
  pointer-events: none;
}
.bolt { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #23212a; border: 2px solid #0f0c10; }
.b1 { top: 7px; left: 7px; } .b2 { top: 7px; right: 7px; } .b3 { bottom: 7px; left: 7px; } .b4 { bottom: 7px; right: 7px; }

.visitor-box {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100%;
  gap: 16px;
  align-items: center;
  padding: 18px;
}
.silhouette {
  width: 190px;
  height: 260px;
  margin: auto;
  background: linear-gradient(#786d66, #3b312f);
  border-radius: 120px 120px 32px 32px;
  box-shadow: inset 0 0 45px rgba(0,0,0,.52), 0 0 20px rgba(245, 210, 142, .22);
  animation: breathe 2.6s ease-in-out infinite;
}
@keyframes breathe { 0%,100% { transform: translateY(0) scale(1);} 50% { transform: translateY(-4px) scale(1.02);} }

.sub { color: var(--dim); }
#docStatus { margin-top: 8px; color: #dfcab3; }
.hint-box {
  border: 1px dashed #917086;
  background: rgba(32,22,39,.62);
  border-radius: 7px;
  padding: 10px;
  color: #dccfd7;
}

.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.question-panel {
  display: none;
  margin-top: 10px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}
.q-btn {
  background: linear-gradient(180deg, #3f495f, #2e3444);
  border: 1px solid #73809d;
  color: #eef2ff;
  font-size: 12px;
  padding: 8px;
  border-radius: 6px;
}
.q-btn:disabled { opacity: .45; cursor: not-allowed; }

.data-box {
  min-height: 92px;
  padding: 10px;
  display: grid;
  place-items: center;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .8px;
}

ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 8px; }
li {
  animation: fadeList .25s ease;
  background: rgba(0,0,0,.15);
  border: 1px solid rgba(255,255,255,.06);
  padding: 7px;
  border-radius: 6px;
  list-style-position: inside;
}
@keyframes fadeList { from { opacity: 0; transform: translateX(-8px);} to { opacity: 1; transform: translateX(0);} }

.desk {
  background:
    linear-gradient(180deg, #2d2025, #1b1517),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.03) 2px, transparent 2px, transparent 8px);
  border-radius: 10px;
  padding: 12px;
}
.desk-top { display: flex; align-items: center; gap: 12px; }
.phone {
  width: 74px; height: 46px;
  border-radius: 28px;
  background: radial-gradient(circle at 30% 30%, #656874, #252733);
  border: 2px solid #111319;
  box-shadow: inset 0 0 10px rgba(255,255,255,.07), 0 6px 12px rgba(0,0,0,.28);
}

.book-cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.book-card {
  background: linear-gradient(180deg, #533a3c, #312528);
  border: 1px solid #8e6b66;
  color: var(--ink);
  border-radius: 7px;
  padding: 8px;
  cursor: pointer;
  text-align: left;
  transition: transform .14s ease, box-shadow .2s ease, border-color .2s ease;
}
.book-card:hover { transform: translateY(-3px); box-shadow: 0 8px 14px rgba(0,0,0,.28); border-color: #b88f84; }
.book-card.selected { outline: 2px solid var(--accent); box-shadow: 0 0 20px rgba(216,173,119,.4); }
.book-card.lost { opacity: .35; cursor: not-allowed; }

.book-detail {
  margin-top: 10px;
  background: linear-gradient(180deg, rgba(40,28,30,.95), rgba(24,18,20,.96));
  border: 1px solid #715259;
  border-radius: 7px;
  padding: 10px;
  min-height: 80px;
}

.actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
button {
  background: linear-gradient(180deg, #66464d, #442f35);
  color: var(--ink);
  border: 1px solid #956f77;
  border-radius: 7px;
  padding: 10px 14px;
  cursor: pointer;
  transition: transform .12s ease, filter .16s ease, box-shadow .2s ease;
}
button:hover { filter: brightness(1.14); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.25); }
button:active { transform: translateY(1px); }
#giveBtn { border-color: #d8ad77; }
#rejectBtn { border-color: #d56f74; }
.mini-btn { padding: 6px 8px; font-size: 12px; white-space: nowrap; }

.type-in { animation: typeIn .24s ease; }
@keyframes typeIn { from { opacity: 0; transform: translateY(7px);} to { opacity: 1; transform: translateY(0);} }
.shake { animation: shake .26s linear; }
@keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-4px);} 75% { transform: translateX(4px);} }

@media (max-width: 1080px) {
  .main-grid { grid-template-columns: 1fr; }
  .book-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud { grid-template-columns: repeat(2, 1fr); }
}

</style>
  </head>
  <body>
    <canvas id="fxCanvas" aria-hidden="true"></canvas>
    <div id="screenFlash" aria-hidden="true"></div>
    <div id="notification" aria-live="polite"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="game-shell">
      <header class="hud frame">
        <div id="day">Day 1</div>
        <div id="tempFuel">온도 4℃ | 연료 20</div>
        <div id="foodHunger">식량 20 | 허기 0</div>
        <div id="threat">위협도 0 (안정)</div>
      </header>

      <main class="main-grid">
        <aside class="panel left-panel frame">
          <h2>심사 체크리스트</h2>
          <div id="memoPanel" class="widget memo-panel"></div>
          <h3>어제의 결과</h3>
          <ul id="resultLog"></ul>
          <button id="alertBtn" class="big-alert" type="button" aria-label="격리 프로토콜"></button>
        </aside>

        <section class="panel center-panel frame">
          <div class="monitor-shell">
            <span class="bolt b1"></span><span class="bolt b2"></span><span class="bolt b3"></span><span class="bolt b4"></span>
            <div class="screen-inner">
              <div class="scanline" aria-hidden="true"></div>
              <div class="visitor-box">
                <div class="silhouette"></div>
                <div class="visitor-info">
                  <h2 id="visitorName">방문자</h2>
                  <p id="visitorTrait" class="sub"></p>
                  <p id="requestText"></p>
                  <p id="docStatus" class="sub"></p>
                </div>
              </div>
            </div>
          </div>
          <div class="hint-box">
            <p id="trustHint"></p>
            <div id="questionPanel" class="question-panel"></div>
          </div>
        </section>

        <aside class="panel right-panel frame">
          <div class="panel-head">
            <h2>무전기 / 사건 경보</h2>
            <button id="audioBtn" class="mini-btn" type="button">🔇 사운드 OFF</button>
          </div>
          <div id="dataBox" class="widget data-box">검문 통계 로딩중...</div>
          <ul id="radioLog"></ul>
        </aside>
      </main>

      <footer class="desk frame">
        <div class="desk-top">
          <div class="phone" aria-hidden="true"></div>
          <h2>책상: 도서 선택</h2>
        </div>
        <div id="bookCards" class="book-cards"></div>
        <div id="bookDetail" class="book-detail">도서를 선택하세요.</div>
        <div class="actions">
          <button id="giveBtn">대출 승인 + 도서 전달</button>
          <button id="rejectBtn">대출 보류/반려</button>
          <button id="askBtn">질문/검사</button>
        </div>
      </footer>
    </div>

    <script>
const books = [
  { id: "practical_farming", name: "농사 입문", type: "실용서", desc: "비료, 윤작, 종자 보관법.", risk: 0 },
  { id: "practical_medicine", name: "응급 처치", type: "실용서", desc: "지혈, 열 관리, 부목 고정.", risk: 0 },
  { id: "practical_water", name: "정수와 위생", type: "실용서", desc: "물 소독과 감염 예방법.", risk: 0 },
  { id: "tech_guns", name: "총기 정비 매뉴얼", type: "기술서", desc: "무기 분해·재조립.", risk: 2 },
  { id: "tech_explosive", name: "즉석 폭약 공학", type: "기술서", desc: "고위험 제작 지식.", risk: 3 },
  { id: "forbidden_cult", name: "금서: 군중심리", type: "금서", desc: "선동과 광신의 구조.", risk: 3 }
];

const requests = [{ id: "fertilizer" }, { id: "fever" }, { id: "defense" }, { id: "faith" }];
const requestTextPool = {
  fertilizer: ["비료 만드는 법이 적힌 책이 필요합니다.", "씨앗이 죽어가요. 토양 되살리는 기록이 있습니까?", "거름 배합법을 모르겠어. 이번 파종이 마지막이야."],
  fever: ["열병 치료법을 찾고 있어요.", "해열과 격리 절차가 필요합니다. 환자가 늘고 있습니다.", "아이들 고열이 멈추지 않습니다. 의학서를 빌려주세요."],
  defense: ["마을 방어선을 강화할 방법이 필요해.", "성문이 오래 못 버텨. 방어 설계 관련 책을 찾고 있어.", "습격이 예고됐어. 방어 준비 지식을 원한다."],
  faith: ["사람들 마음을 하나로 묶을 말이 필요합니다.", "공동체가 갈라지고 있어요. 결속에 관한 텍스트가 필요합니다.", "폭동 직전입니다. 사람들을 진정시킬 지식이 필요해요."]
};

const firstNames = ["민", "하", "준", "수", "율", "도", "린", "서", "진", "유", "나", "현"];
const lastNames = ["강", "서", "박", "윤", "한", "오", "남", "진", "백", "문", "심", "노"];
const jobs = ["정비사", "교사", "배달원", "경비", "간호사", "사서", "농부", "상인", "기록관", "통신병", "제빵사", "재단사"];
const accessories = ["붉은 스카프", "철제 반지", "검은 장갑", "청동 목걸이", "고글", "붕대", "은색 핀", "왼쪽 귀걸이", "가죽 팔찌", "파란 완장"];

const residentDirectory = Array.from({ length: 48 }, (_, i) => ({
  id: `R-${1000 + i}`,
  name: `${lastNames[i % lastNames.length]}${firstNames[(i * 3) % firstNames.length]}${firstNames[(i * 5 + 1) % firstNames.length]}`,
  apt: `${1 + (i % 9)}0${1 + (i % 5)}`,
  job: jobs[i % jobs.length],
  accessory: accessories[i % accessories.length]
}));

const questionTemplates = [
  { id: "id", label: "거래증서 확인" },
  { id: "permit", label: "보상 약속서 확인" },
  { id: "phone", label: "무전 연락처 확인" },
  { id: "accessory", label: "소지품 단서 대조" },
  { id: "reason", label: "요청 목적 확인" },
  { id: "history", label: "이전 대출 기록" }
];

const outcomeTable = {
  fertilizer: {
    practical_farming: [
      { chance: 0.85, result: "[탐험 보고서] 밭이 살아났습니다. 버섯과 감자가 올라와 식량 3상자를 보냈습니다.", food: 3, fuel: 0, threat: -1, death: false },
      { chance: 0.15, result: "[탐험 보고서] 비료 제조엔 성공했지만 저장고가 젖어 절반만 건졌습니다. 식량 1상자만 도착했습니다.", food: 1, fuel: 0, threat: 0, death: false }
    ],
    practical_medicine: [
      { chance: 0.8, result: "[탐험 보고서] 병충해 원인을 찾아내 밭 일부를 지켰습니다. 식량 2를 보냅니다.", food: 2, fuel: 0, threat: 0, death: false },
      { chance: 0.2, result: "[탐험 보고서] 소독은 했지만 비료법이 없어 수확이 적었습니다. 식량 1만 확보했습니다.", food: 1, fuel: 0, threat: 0, death: false }
    ],
    practical_water: [
      { chance: 0.85, result: "[탐험 보고서] 오염수 문제를 잡아 파종은 지켰습니다. 연료 1과 식량 1을 보냅니다.", food: 1, fuel: 1, threat: 0, death: false },
      { chance: 0.15, result: "[탐험 보고서] 물은 깨끗해졌지만 토양은 죽어 수확이 늦어집니다.", food: 0, fuel: 0, threat: 0, death: false }
    ],
    tech_guns: [
      { chance: 0.8, result: "[탐험 보고서] 씨앗 대신 탄약을 모으는 분위기가 퍼졌습니다. 방어는 올랐지만 배고픔이 커집니다.", food: 0, fuel: 1, threat: 2, death: false },
      { chance: 0.2, result: "[탐험 보고서] 식량 탐사대가 무장 충돌로 전멸했습니다. 책이 돌아오지 않았습니다.", food: 0, fuel: 0, threat: 3, death: true }
    ],
    tech_explosive: [
      { chance: 0.75, result: "[탐험 보고서] 창고 폭파로 해충은 사라졌으나 밭도 함께 날아갔습니다. 연료 2만 도착.", food: 0, fuel: 2, threat: 3, death: false },
      { chance: 0.25, result: "[탐험 보고서] 폭약 사고로 탐험대가 사망했습니다. 도서 소실.", food: 0, fuel: 0, threat: 4, death: true }
    ],
    forbidden_cult: [
      { chance: 0.9, result: "[탐험 보고서] '흙의 교리' 집회가 열려 작업 속도는 올랐지만 맹신 분위기가 짙어졌습니다. 식량 2.", food: 2, fuel: 0, threat: 2, death: false },
      { chance: 0.1, result: "[탐험 보고서] 교리 해석 다툼으로 분열이 발생, 대가가 오지 않았습니다.", food: 0, fuel: 0, threat: 3, death: false }
    ]
  },
  fever: {
    practical_farming: [
      { chance: 0.85, result: "[탐험 보고서] 허브 재배법만 건져 응급 대처했습니다. 식량 1과 연료 1을 보냅니다.", food: 1, fuel: 1, threat: 0, death: false },
      { chance: 0.15, result: "[탐험 보고서] 치료 실패로 1명이 사망. 공포가 번졌습니다.", food: 0, fuel: 0, threat: 1, death: false }
    ],

function buildVisitor(){
  const resident=pick(residentDirectory); const isHostile=Math.random()<0.36;
  const shownName=isHostile && Math.random()<0.72 ? pick(residentDirectory).name : resident.name;
  const shownApt=isHostile && Math.random()<0.62 ? pick(residentDirectory).apt : resident.apt;
  const shownAccessory=isHostile && Math.random()<0.7 ? pick(accessories) : resident.accessory;
  const idDoc={name:shownName,apt:shownApt,id:resident.id,expiry:1955+Math.floor(Math.random()*3)};
  const permitDoc={apt:Math.random()<0.12 ? pick(residentDirectory).apt : shownApt, seal:Math.random()>(isHostile?0.45:0.05)};
  const flags=[]; if(idDoc.name!==resident.name) flags.push('거래증서 이름 불일치'); if(idDoc.apt!==resident.apt) flags.push('거래증서 거점 불일치');
  if(!permitDoc.seal) flags.push('보상 약속서 서명 없음'); if(permitDoc.apt!==resident.apt) flags.push('보상약속서 거점 불일치'); if(shownAccessory!==resident.accessory) flags.push('소지품 불일치');
  return {resident,isHostile,shownName,shownAccessory,idDoc,permitDoc,flags,suspicious:(isHostile?28:7)+flags.length*6+Math.floor(Math.random()*10),trait:`${pick(['경계','초조','침착','과장된 친절','피로'])}한 태도. 직업 주장: ${pick(jobs)}.`};
}

function renderMemoPanel(){const checks=['거래증서 확인','보상약속서 확인','무전 연락처 확인','소지품 단서 대조','요청 목적 확인','이전 대출 기록']; el.memoPanel.innerHTML=checks.map(c=>`<label><input type="checkbox" disabled ${state.askedQuestions.has(cMap[c])?'checked':''}/> ${c}</label>`).join('');}

function askQuestion(type){
  if(state.askedQuestions.has(type)) return; state.askedQuestions.add(type);
  const v=state.currentVisitor;
  const ans={
    id:`거래증서: ${v.idDoc.name} / ${v.idDoc.apt} / 만료 ${v.idDoc.expiry}`,
    permit:`보상약속서: ${v.permitDoc.apt} / 봉인 ${v.permitDoc.seal?'정상':'누락'}`,
    phone:`거점 전화: ${v.isHostile?'해당 팀이 이미 현장에 있다고 응답':'요청자 본인 신원 일치 응답'}`,
    accessory:`소지품: 현재 '${v.shownAccessory}' / 주민표 '${v.resident.accessory}'`,
    reason:`진술: ${state.currentRequest.text}`,
    history:`기록: ${v.isHostile?'동일 인물 사칭 제보 존재':'최근 문제 없는 대출 거래 기록'}`
  };
  v.suspicious = Math.max(4, v.suspicious + ((v.flags.length && ['id','permit','accessory','phone'].includes(type))?3:-2));
  el.trustHint.textContent=`신뢰도 단서: 신뢰 위험도 추정 ${v.suspicious}%`;
  el.docStatus.textContent=`검증 상태: ${v.flags.length?v.flags.join(', '):'이상 없음'}`;
  state.radio.push(`검증: ${ans[type]}`); renderLogs(); renderQuestionPanel();
}

function approveVisitor(){if(!state.selectedBookId){alert('먼저 도서를 선택하세요.');return;} const v=state.currentVisitor; state.stats.approved+=1; if(v.isHostile && v.flags.length>=2){state.threat+=3; state.logs.push(`Day ${state.day}: 약탈 성향 방문자를 승인했습니다. 서고 위협이 증가했습니다.`);} resolveBookDelivery(); flash(); advanceDay();}
function rejectVisitor(){const v=state.currentVisitor; state.stats.rejected+=1; if(!v.isHostile){state.stats.trustLosses+=1; state.threat+=2; state.food=Math.max(0,state.food-1); state.logs.push(`Day ${state.day}: 정상 탐험가를 반려해 신뢰가 하락했습니다.`);} else {state.stats.threatsStopped+=1; state.threat=Math.max(0,state.threat-1); state.logs.push(`Day ${state.day}: 위험 성향 방문자를 반려했습니다.`);} state.radio.push('무전: 대출 반려 처리 완료.'); flash(); advanceDay();}

  const parts=[];
  const tone=(f,d=0.07,t='triangle',g=0.03)=>{if(!audioOn)return; ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume(); const o=ac.createOscillator(); const gain=ac.createGain(); o.type=t; o.frequency.value=f; gain.gain.value=0.0001; gain.gain.exponentialRampToValueAtTime(g,ac.currentTime+0.01); gain.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d); o.connect(gain).connect(ac.destination); o.start(); o.stop(ac.currentTime+d)};
  function toggleAmbient(){audioOn=!audioOn; if(audioOn){ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const b=ac.createBuffer(1,2*ac.sampleRate,ac.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<ch.length;i++) ch[i]=(Math.random()*2-1)*0.18; ambient=ac.createBufferSource(); ambient.buffer=b; ambient.loop=true; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380; const g=ac.createGain(); g.gain.value=.018; ambient.connect(f).connect(g).connect(ac.destination); ambient.start(); audioBtn.textContent='🔊 사운드 ON'; notify('환경음 활성화');} else {if(ambient){ambient.stop(); ambient.disconnect(); ambient=null;} audioBtn.textContent='🔇 사운드 OFF'; notify('환경음 비활성화');}}
  audioBtn.addEventListener('click',toggleAmbient);
  document.body.addEventListener('click',e=>{if(e.target.closest('button')) tone(260,0.05,'triangle',0.026)},true);
  const resize=()=>{canvas.width=innerWidth; canvas.height=innerHeight};
  const tick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height); if(Math.random()<.7&&parts.length<90) parts.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.6,vx:(Math.random()-.5)*.15,vy:-Math.random()*.25-.05,a:Math.random()*.35+.08}); for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.x+=p.vx;p.y+=p.vy;p.a*=.996; ctx.fillStyle=`rgba(227,188,137,${p.a})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); if(p.y<-10||p.a<.02) parts.splice(i,1);} requestAnimationFrame(tick)};
  resize(); tick(); addEventListener('resize',resize);
