<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지식의 방주: 라스트 라이브러리</title>
    <style>
:root {
  --bg: #12100f;
  --panel: #1d1916;
  --ink: #e8dcc6;
  --dim: #b8ab93;
  --accent: #c49a5d;
  --warn: #df6d5b;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
  background: radial-gradient(circle at top, #2a241e, var(--bg));
  color: var(--ink);
  overflow-x: hidden;
}

#fxCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .5;
}

#screenFlash {
  position: fixed;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background: radial-gradient(circle, rgba(244,202,125,.28), rgba(0,0,0,0));
  opacity: 0;
  transition: opacity .25s ease;
}
#screenFlash.active { opacity: 1; }

#notification {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 5;
  background: rgba(15, 13, 11, .92);
  border: 1px solid #745f43;
  color: var(--ink);
  padding: 10px 12px;
  border-radius: 8px;
  transform: translateY(20px);
  opacity: 0;
  transition: .25s ease;
}
#notification.show { transform: translateY(0); opacity: 1; }

.game-shell {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
  padding: 12px;
}

.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.hud > div {
  background: linear-gradient(180deg, #26201a, #1a1613);
  border: 1px solid #3b322a;
  padding: 10px;
  text-align: center;
  box-shadow: 0 0 0 1px #000 inset, 0 8px 20px rgba(0,0,0,.2);
}

.main-grid {
  display: grid;
  grid-template-columns: 260px 1fr 260px;
  gap: 10px;
}

.panel {
  background: linear-gradient(180deg, rgba(31, 27, 23, .96), rgba(22, 19, 16, .96));
  border: 1px solid #3b322a;
  padding: 10px;
  min-height: 320px;
  box-shadow: 0 12px 24px rgba(0,0,0,.25);
  backdrop-filter: blur(1px);
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.center-panel {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 10px;
}

.visitor-box {
  display: grid;
  grid-template-columns: 170px 1fr;
  gap: 12px;
  align-items: center;
}

.silhouette {
  width: 150px;
  height: 220px;
  margin: auto;
  background: linear-gradient(#5a5046, #27221e);
  border-radius: 100px 100px 30px 30px;
  filter: brightness(0.9);
  box-shadow: inset 0 0 40px rgba(0,0,0,.45), 0 0 16px rgba(220,180,120,.14);
  animation: breathe 2.5s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.02); }
}

.visitor-info h2,
.visitor-info p,
.hint-box p,
#bookDetail {
  transition: opacity .2s ease, transform .2s ease;
}

.type-in {
  animation: typeIn .25s ease;
}
@keyframes typeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.sub { color: var(--dim); }

.hint-box {
  border-top: 1px dashed #55483b;
  padding-top: 8px;
  color: var(--dim);
}

ul {
  margin: 8px 0 0;
  padding-left: 18px;
  display: grid;
  gap: 8px;
}

li { animation: fadeList .22s ease; }
@keyframes fadeList {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

.desk {
  background: linear-gradient(180deg, #1d1813, #171411);
  border: 1px solid #3b322a;
  padding: 10px;
}

.book-cards {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
}

.book-card {
  background: linear-gradient(180deg, #32271d, #251f19);
  border: 1px solid #584937;
  color: var(--ink);
  padding: 8px;
  cursor: pointer;
  text-align: left;
  transition: transform .12s ease, box-shadow .2s ease;
}

.book-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0,0,0,.2);
}

.book-card.selected {
  outline: 2px solid var(--accent);
  box-shadow: 0 0 18px rgba(203,154,90,.35);
}

.book-card.lost {
  opacity: .35;
  cursor: not-allowed;
}

.book-detail {
  margin-top: 10px;
  background: #221c17;
  border: 1px solid #4c4033;
  padding: 10px;
  min-height: 72px;
}

.actions {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

button {
  background: #3d3228;
  color: var(--ink);
  border: 1px solid #6d5a45;
  padding: 10px 14px;
  cursor: pointer;
  transition: transform .12s ease, filter .16s ease;
}
button:hover { filter: brightness(1.13); transform: translateY(-1px); }
button:active { transform: translateY(1px); }

#giveBtn { border-color: var(--accent); }
#rejectBtn { border-color: var(--warn); }

.mini-btn {
  padding: 6px 8px;
  font-size: 12px;
  white-space: nowrap;
}

.shake { animation: shake .26s linear; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

@media (max-width: 1000px) {
  .main-grid { grid-template-columns: 1fr; }
  .book-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hud { grid-template-columns: repeat(2, 1fr); }
}

</style>
  </head>
  <body>

    <div id="notification" aria-live="polite"></div>

        <section class="panel center-panel">
          <div class="visitor-box">

          <div class="hint-box">

        <aside class="panel right-panel">
          <div class="panel-head">
            <h2>무전기 / 사건 경보</h2>
            <button id="audioBtn" class="mini-btn" type="button">🔇 사운드 OFF</button>
          </div>
          <ul id="radioLog"></ul>
        </aside>
      </main>

      <footer class="desk">
        <h2>책상: 도서 선택</h2>
        <div id="bookCards" class="book-cards"></div>
        <div id="bookDetail" class="book-detail">도서를 선택하세요.</div>
        <div class="actions">
          <button id="giveBtn">전달</button>
          <button id="rejectBtn">거절</button>
          <button id="askBtn">추가 질문</button>
        </div>
      </footer>
    </div>

      { chance: 0.8, result: "[탐험 보고서] 무장 경비대가 질서를 잡았습니다. 당장은 안전하지만 공포 통치가 시작됩니다.", food: 0, fuel: 2, threat: 3, death: false },
      { chance: 0.2, result: "[탐험 보고서] 무장파 내분으로 요청자가 사망. 책 회수 실패.", food: 0, fuel: 0, threat: 4, death: true }
    ],
    tech_explosive: [
      { chance: 0.77, result: "[탐험 보고서] 기념탑 폭파 사건 이후 강경파가 권력을 잡았습니다. 연료 2.", food: 0, fuel: 2, threat: 4, death: false },
      { chance: 0.23, result: "[탐험 보고서] 폭약 실험이 실패해 다수 사상자. 요청자는 돌아오지 못했습니다.", food: 0, fuel: 0, threat: 5, death: true }
    ],
    forbidden_cult: [
      { chance: 0.93, result: "[탐험 보고서] 교리가 퍼지며 공동체가 결속했습니다. 동시에 도서관 검열 요구가 올라옵니다. 식량 1.", food: 1, fuel: 0, threat: 3, death: false },
      { chance: 0.07, result: "[탐험 보고서] 광신 집단이 경쟁 분파를 처형했습니다. 지역 정세가 폭발 직전입니다.", food: 0, fuel: 0, threat: 6, death: false }
    ]
  }
};

const state = {
  day: 1,
  fuel: 20,
  food: 20,
  hunger: 0,
  threat: 0,
  logs: [],
  radio: ["무전기 연결 정상. 외부 신호 약함."],
  selectedBookId: null,
  currentVisitor: null,
  currentRequest: null,
  lostBooks: new Set()
};

const el = {
  day: document.getElementById("day"),
  tempFuel: document.getElementById("tempFuel"),
  foodHunger: document.getElementById("foodHunger"),
  threat: document.getElementById("threat"),
  visitorName: document.getElementById("visitorName"),
  visitorTrait: document.getElementById("visitorTrait"),
  requestText: document.getElementById("requestText"),
  trustHint: document.getElementById("trustHint"),
  resultLog: document.getElementById("resultLog"),
  radioLog: document.getElementById("radioLog"),
  bookCards: document.getElementById("bookCards"),
  bookDetail: document.getElementById("bookDetail"),
  giveBtn: document.getElementById("giveBtn"),
  rejectBtn: document.getElementById("rejectBtn"),
  askBtn: document.getElementById("askBtn")
};

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function weightedPick(items) {
  const r = Math.random();
  let acc = 0;
  for (const item of items) {
    acc += item.chance;
    if (r <= acc) return item;
  }
  return items[items.length - 1];
}

function threatLabel(value) {
  if (value < 4) return "안정";
  if (value < 8) return "긴장";
  if (value < 12) return "불안";
  return "붕괴 직전";
}

function renderBooks() {
  el.bookCards.innerHTML = "";
  books.forEach((book) => {
    const btn = document.createElement("button");
    const lost = state.lostBooks.has(book.id);
    btn.className = `book-card ${state.selectedBookId === book.id ? "selected" : ""} ${lost ? "lost" : ""}`;
    btn.disabled = lost;
    btn.innerHTML = `<strong>${book.name}</strong><br/><small>${book.type}</small>`;
    btn.onclick = () => {
      state.selectedBookId = book.id;
      el.bookDetail.textContent = `${book.name} — ${book.desc}`;
      renderBooks();
    };
    el.bookCards.appendChild(btn);
  });
}

function renderLogs() {
  el.resultLog.innerHTML = "";
  [...state.logs].slice(-8).reverse().forEach((log) => {
    const li = document.createElement("li");
    li.textContent = log;
    el.resultLog.appendChild(li);
  });

  el.radioLog.innerHTML = "";
  [...state.radio].slice(-8).reverse().forEach((r) => {
    const li = document.createElement("li");
    li.textContent = r;
    el.radioLog.appendChild(li);
  });
}

function updateHud() {
  el.day.textContent = `Day ${state.day}`;
  const temp = Math.max(-10, 8 - Math.floor((20 - state.fuel) / 3));
  el.tempFuel.textContent = `온도 ${temp}℃ | 연료 ${state.fuel}`;
  el.foodHunger.textContent = `식량 ${state.food} | 허기 ${state.hunger}`;
  el.threat.textContent = `위협도 ${state.threat} (${threatLabel(state.threat)})`;
}

function nextVisitor() {
  state.currentVisitor = pick(visitors);
  state.currentRequest = pick(requests);
  state.selectedBookId = null;

  const suspicious = state.currentVisitor.id === "scammer" ? 35 : state.currentVisitor.id === "raider" ? 28 : 12;
  el.visitorName.textContent = state.currentVisitor.name;
  el.visitorTrait.textContent = state.currentVisitor.trait;
  el.requestText.textContent = state.currentRequest.text;
  el.trustHint.textContent = `신뢰도 단서: 거짓말 확률 추정 ${suspicious}%`;
  el.bookDetail.textContent = "도서를 선택하세요.";
  renderBooks();
}

function consumeDailyResources() {
  state.fuel = Math.max(0, state.fuel - 2);
  state.food = Math.max(0, state.food - 2);
  if (state.food === 0) state.hunger += 2;
  if (state.fuel === 0) state.hunger += 1;
}

function applyEndingCheck() {
  if (state.hunger >= 15) {
    alert("엔딩: 관리자가 굶주림으로 쓰러졌습니다. 지식의 불이 꺼졌습니다.");
    location.reload();
  }
  if (state.threat >= 18) {
    alert("엔딩: 약탈과 검열이 도서관을 덮쳤습니다. 서고는 잿더미가 되었습니다.");
    location.reload();
  }
  if (state.day >= 20 && state.threat <= 7) {
    alert("엔딩: 지식의 성전이 세워졌습니다. 생존자들이 도서관을 중심으로 재건을 시작합니다.");
    location.reload();
  }
}

function advanceDay() {
  state.day += 1;
  consumeDailyResources();
  updateHud();
  renderLogs();
  nextVisitor();
  applyEndingCheck();
}

function giveBook() {
  if (!state.selectedBookId) {
    alert("먼저 도서를 선택하세요.");
    return;
  }

  const outcomes = outcomeTable[state.currentRequest.id][state.selectedBookId];
  const pickedOutcome = weightedPick(outcomes);
  state.logs.push(`Day ${state.day}: ${pickedOutcome.result}`);
  state.food = Math.max(0, state.food + pickedOutcome.food);
  state.fuel = Math.max(0, state.fuel + pickedOutcome.fuel);
  state.threat = Math.max(0, state.threat + pickedOutcome.threat);

  if (pickedOutcome.death) {
    state.lostBooks.add(state.selectedBookId);
    state.radio.push(`무전: 요청자 사망 확인. '${books.find((b) => b.id === state.selectedBookId).name}' 분실.`);
  } else {
    state.radio.push("무전: 생존자 신호 수신. 대가가 도착했습니다.");
  }

  if (state.lostBooks.size === books.length) {
    alert("엔딩: 모든 책이 사라졌습니다. 지식의 소실로 문명이 멈췄습니다.");
    location.reload();
    return;
  }

  advanceDay();
}

function rejectVisitor() {
  state.logs.push(`Day ${state.day}: 요청을 거절했습니다. 방문자는 빈손으로 떠났습니다.`);
  state.threat += 1;
  state.radio.push("무전: 거절 소문이 퍼져 도서관 평판이 하락 중.");
  advanceDay();
}

function askMore() {
  const hints = {
    honest: "추가 질문 답변: 목적과 대가를 구체적으로 설명했다.",
    scammer: "추가 질문 답변: 대가를 말할 때 시선이 흔들렸다.",
    raider: "추가 질문 답변: 방어라 했지만 약탈단 동선을 자꾸 묻는다.",
    nurse: "추가 질문 답변: 환자 수와 증상을 정확히 기록해왔다."
  };
  state.radio.push(hints[state.currentVisitor.id]);
  renderLogs();
}

el.giveBtn.addEventListener("click", giveBook);
el.rejectBtn.addEventListener("click", rejectVisitor);
el.askBtn.addEventListener("click", askMore);

updateHud();
renderBooks();
renderLogs();
nextVisitor();

// --- Quality layer: motion, FX, and synthesized audio (no external assets) ---
(function setupQualityLayer() {
  const fxCanvas = document.getElementById("fxCanvas");
  const flashEl = document.getElementById("screenFlash");
  const noteEl = document.getElementById("notification");
  const audioBtn = document.getElementById("audioBtn");

  const audio = {
    enabled: false,
    ctx: null,
    noiseNode: null,
    ensure() {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    },
    tone(freq, duration = 0.08, type = "triangle", gainValue = 0.03) {
      if (!this.enabled) return;
      this.ensure();
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, this.ctx.currentTime);
      g.gain.setValueAtTime(0.0001, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(gainValue, this.ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      o.connect(g).connect(this.ctx.destination);
      o.start();
      o.stop(this.ctx.currentTime + duration);
    },
    startAmbient() {
      if (!this.enabled || this.noiseNode) return;
      this.ensure();
      const bufferSize = 2 * this.ctx.sampleRate;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i += 1) output[i] = (Math.random() * 2 - 1) * 0.2;

      const whiteNoise = this.ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const bandpass = this.ctx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = 420;
      bandpass.Q.value = 0.9;

      const gain = this.ctx.createGain();
      gain.gain.value = 0.018;

      whiteNoise.connect(bandpass).connect(gain).connect(this.ctx.destination);
      whiteNoise.start();
      this.noiseNode = whiteNoise;
    },
    stopAmbient() {
      if (!this.noiseNode) return;
      this.noiseNode.stop();
      this.noiseNode.disconnect();
      this.noiseNode = null;
    }
  };

  function notify(msg) {
    noteEl.textContent = msg;
    noteEl.classList.add("show");
    setTimeout(() => noteEl.classList.remove("show"), 1200);
  }

  function pulseFlash() {
    flashEl.classList.add("active");
    setTimeout(() => flashEl.classList.remove("active"), 170);
  }

  function shakePanel() {
    const center = document.querySelector(".center-panel");
    center.classList.add("shake");
    setTimeout(() => center.classList.remove("shake"), 260);
  }

  function typeAnim(elm) {
    elm.classList.remove("type-in");
    void elm.offsetWidth;
    elm.classList.add("type-in");
  }

  const observer = new MutationObserver(() => {
    typeAnim(document.getElementById("requestText"));
    typeAnim(document.getElementById("visitorName"));
  });
  observer.observe(document.getElementById("requestText"), { childList: true });

  document.body.addEventListener(
    "click",
    (e) => {
      if (e.target.closest("button")) audio.tone(270, 0.05, "triangle", 0.028);
    },
    true
  );

  document.getElementById("giveBtn").addEventListener("click", () => {
    pulseFlash();
    if (state.selectedBookId) {
      const latest = state.logs[state.logs.length - 1] || "";
      if (latest.includes("사망") || latest.includes("소실")) {
        shakePanel();
        audio.tone(120, 0.15, "sawtooth", 0.04);
      } else {
        audio.tone(420, 0.12, "triangle", 0.04);
      }
    }
  });

  document.getElementById("rejectBtn").addEventListener("click", () => {
    shakePanel();
    audio.tone(160, 0.1, "square", 0.03);
  });

  document.getElementById("askBtn").addEventListener("click", () => {
    audio.tone(520, 0.09, "triangle", 0.028);
  });

  audioBtn.addEventListener("click", () => {
    audio.enabled = !audio.enabled;
    if (audio.enabled) {
      audio.startAmbient();
      audioBtn.textContent = "🔊 사운드 ON";
      notify("환경음 활성화");
    } else {
      audio.stopAmbient();
      audioBtn.textContent = "🔇 사운드 OFF";
      notify("환경음 비활성화");
    }
  });

  // particle dust
  const ctx = fxCanvas.getContext("2d");
  const particles = [];
  const maxParticles = 70;

  function resize() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }

  function spawn() {
    if (particles.length > maxParticles) return;
    particles.push({
      x: Math.random() * fxCanvas.width,
      y: Math.random() * fxCanvas.height,
      r: Math.random() * 2 + 0.6,
      vx: (Math.random() - 0.5) * 0.12,
      vy: -Math.random() * 0.22 - 0.04,
      a: Math.random() * 0.35 + 0.06
    });
  }

  function tick() {
    ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    if (Math.random() < 0.75) spawn();

    for (let i = particles.length - 1; i >= 0; i -= 1) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.a *= 0.996;
      ctx.beginPath();
      ctx.fillStyle = `rgba(227, 188, 137, ${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.y < -10 || p.a < 0.02) particles.splice(i, 1);
    }

    requestAnimationFrame(tick);
  }

  resize();
  tick();
  window.addEventListener("resize", resize);
})();
